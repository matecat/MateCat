# ─────────────────────────────────────────────────────────────────────────────
# REUSABLE WORKFLOW: Test, build, and deploy MateCat Docker images
#
# Called by aws_dev.yml and aws_prod.yml via workflow_call.
# This file contains ALL shared logic — callers only define triggers and
# pass the target environment name.
#
# INPUTS:
#   deploy_environment – GitHub environment name ("develop" or "production")
#   should_deploy      – whether the deploy job should run (true/false)
#
# GITHUB ENVIRONMENTS required:
#   ci_test     – vars.AWS_ACCESS_KEY_ID, secrets.AWS_SECRET_ACCESS_KEY
#   develop     – vars.AWS_ACCESS_KEY_ID, secrets.AWS_SECRET_ACCESS_KEY
#   production  – vars.AWS_ACCESS_KEY_ID, secrets.AWS_SECRET_ACCESS_KEY
#   All need:    secrets.CI_USER_TOKEN_MATECATBOT
# ─────────────────────────────────────────────────────────────────────────────
name: CI/CD Pipeline
on:
  workflow_call:
    inputs:
      deploy_environment:
        description: 'GitHub environment for deploy (develop or production)'
        required: true
        type: string
      should_deploy:
        description: 'Whether to run the deploy job'
        required: true
        type: boolean
env:
  AWS_REGION: 'eu-central-1'
  APP_NAME: matecat
  # Opt into Node.js 24 for all JavaScript-based actions (checkout@v4, etc.)
  # Remove once actions/checkout@v5 is released with native Node 24 support.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
# Permissions are set per-job (not workflow-level) because test-guard
# requires pull-requests:write while other jobs only need contents:read.
# The calling workflow (aws_dev.yml / aws_prod.yml) sets the ceiling.
jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # JOBS 1a and 1b – php-tests and js-tests, run in parallel
  #
  # Both build the same test-node image, then run one script from
  # .github/ci/ inside it, in place of the image's default command
  # (docker/test-node/build_assets.sh, which runs both suites one after the
  # other). Running them side by side cuts the wall time to the slower of the
  # two, the JS one.
  #
  # The image layers of base-node and test-node come from the GitHub Actions
  # cache when their Dockerfiles did not change. The cache holds no secret:
  # the AWS keys of the tests reach the container when it starts, through
  # docker-compose-ci.yml, and never enter the image. The cache scope changes
  # every week (for example "test-images-2026-W46"), so the test image picks
  # up the Ubuntu updates of base-node at least once a week. The deploy job
  # builds its images without any cache.
  #
  # Each job mounts two host folders into the container:
  #   /ci-out    the coverage reports, uploaded for test-guard
  #   /ci-cache  the composer, yarn and npm download caches, kept between
  #              runs by actions/cache and keyed on the lock files
  #
  # On pull_request events, github.ref_name is "<pr_number>/merge" which
  # Upgrade.php does not recognise. We use github.base_ref (the target
  # branch, e.g. "develop" or "master") for PRs, and github.ref_name for
  # pushes/tags.
  # ───────────────────────────────────────────────────────────────────────────
  php-tests:
    name: PHP tests
    runs-on: ubuntu-24.04
    environment: ci_test
    permissions:
      contents: read
    steps:
      # Checkout the repo including all git submodules.
      # Falls back to the built-in github.token for fork PRs where
      # CI_USER_TOKEN_MATECATBOT is not available.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: '${{ secrets.CI_USER_TOKEN_MATECATBOT || github.token }}'
          submodules: recursive

      - name: Restore the composer cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ci-cache
          key: php-deps-${{ hashFiles('composer.lock') }}
          restore-keys: php-deps-

      - name: Name the weekly image cache
        id: image_cache
        run: echo "scope=test-images-$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # test-node starts FROM matecat-base-node-24. The buildx builder cannot
      # see the images of the local docker daemon, so the contexts line points
      # that name at the base-node build of the same bake run. This job also
      # writes the cache that the JS job reads.
      - name: Build images
        uses: docker/bake-action@v7
        env:
          REPOSITORY_BRANCH: ${{ github.base_ref || github.ref_name }}
          REPOSITORY_TAG: ${{ github.base_ref || github.ref_name }}
        with:
          # Local files (the checkout, private submodule included), not the remote git context.
          source: .
          files: docker/docker-compose-ci.yml
          targets: base-node,test-node
          load: true
          # The compose file sets context ".." for every image, meant for docker compose,
          # which reads it from docker/. bake reads it from the working directory, the
          # repository root, so "*.context=." points it back at the same folder.
          set: |
            *.context=.
            *.cache-from=type=gha,scope=${{ steps.image_cache.outputs.scope }}
            *.cache-to=type=gha,scope=${{ steps.image_cache.outputs.scope }},mode=max
            test-node.contexts.matecat-base-node-24=target:base-node

      # The AWS keys are needed by the PHP tests only, so only this job sets
      # them; docker-compose-ci.yml hands them to the container.
      - name: Run PHPUnit
        env:
          TEST_AWS_ACCESS_KEY_ID: ${{ vars.AWS_ACCESS_KEY_ID }}
          TEST_AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          mkdir -p ci-out "$RUNNER_TEMP/ci-cache"
          docker compose -f docker/docker-compose-ci.yml run --rm -T \
            -v "$PWD/ci-out:/ci-out" \
            -v "$RUNNER_TEMP/ci-cache:/ci-cache" \
            -e COMPOSER_CACHE_DIR=/ci-cache/composer \
            test-node /var/www/matecat/.github/ci/php-tests.sh

      # ── Coverage artifact (consumed by test-guard job) ──────────────────
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-php
          path: ci-out/php-coverage.xml
          retention-days: 7

  js-tests:
    name: JS tests
    runs-on: ubuntu-24.04
    environment: ci_test
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: '${{ secrets.CI_USER_TOKEN_MATECATBOT || github.token }}'
          submodules: recursive

      - name: Restore the yarn and npm caches
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ci-cache
          key: js-deps-${{ hashFiles('yarn.lock', 'nodejs/package-lock.json') }}
          restore-keys: js-deps-

      - name: Name the weekly image cache
        id: image_cache
        run: echo "scope=test-images-$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Same build as the PHP job; this one only reads the cache.
      - name: Build images
        uses: docker/bake-action@v7
        env:
          REPOSITORY_BRANCH: ${{ github.base_ref || github.ref_name }}
          REPOSITORY_TAG: ${{ github.base_ref || github.ref_name }}
        with:
          # Local files (the checkout, private submodule included), not the remote git context.
          source: .
          files: docker/docker-compose-ci.yml
          targets: base-node,test-node
          load: true
          # The compose file sets context ".." for every image, meant for docker compose,
          # which reads it from docker/. bake reads it from the working directory, the
          # repository root, so "*.context=." points it back at the same folder.
          set: |
            *.context=.
            *.cache-from=type=gha,scope=${{ steps.image_cache.outputs.scope }}
            test-node.contexts.matecat-base-node-24=target:base-node

      - name: Run Jest and the nodejs tests
        run: |
          mkdir -p ci-out "$RUNNER_TEMP/ci-cache"
          docker compose -f docker/docker-compose-ci.yml run --rm -T \
            -v "$PWD/ci-out:/ci-out" \
            -v "$RUNNER_TEMP/ci-cache:/ci-cache" \
            -e YARN_CACHE_FOLDER=/ci-cache/yarn \
            -e npm_config_cache=/ci-cache/npm \
            test-node /var/www/matecat/.github/ci/js-tests.sh

      # ── Coverage artifact (consumed by test-guard job) ──────────────────
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-js
          path: |
            ci-out/js-coverage.xml
            ci-out/node-coverage.xml
          retention-days: 7
  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2 – deploy (only when should_deploy is true)
  #
  # Builds web-node and daemons-node, tags and pushes to ECR.
  # The ECR registry URL is determined dynamically from the AWS credentials
  # stored in the GitHub environment — no hardcoded account IDs.
  #
  # Versioned tags (build-<version>-<run_number>) are pushed before :latest
  # aliases to ensure both images exist as a consistent pair before :latest
  # is updated.
  # ───────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to ${{ inputs.deploy_environment }}
    runs-on: ubuntu-24.04
    environment: ${{ inputs.deploy_environment }}
    permissions:
      contents: read
    if: ${{ inputs.should_deploy }}
    needs:
      - php-tests
      - js-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: '${{ secrets.CI_USER_TOKEN_MATECATBOT }}'
          submodules: recursive

      # For production deploys (tag-triggered), validate the tag matches
      # strict semver: v<MAJOR>.<MINOR>.<PATCH> (e.g. v1.0.0, v10.2.3)
      # Fails fast before any AWS credentials are used.
      - name: Validate tag format
        if: ${{ inputs.deploy_environment == 'production' }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' does not match v<MAJOR>.<MINOR>.<PATCH>"
            exit 1
          fi
          echo "Tag '$TAG' is valid"

      # Extract version from inc/version.ini for the tag format:
      # build-<version>-<run_number>  (e.g. build-4.1.0-157)
      - name: Read app version
        id: version
        run: |
          BUILD=$(awk 'NF>1 {print $3}' inc/version.ini | sed 's/"//g')
          echo "BUILD=$BUILD" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ vars.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # The registry URL is output dynamically (e.g. xxxxxxxxxxxxx.dkr.ecr...
      # for develop, 449641877310.dkr.ecr... for production).
      - name: Login to Amazon ECR
        id: login_ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Build only base-node, web-node, and daemons-node (no test-node).
      - name: Build images
        env:
          REPOSITORY_BRANCH: ${{ github.ref_name }}
          REPOSITORY_TAG: ${{ github.ref_name }}
        run: |
          docker compose -f docker/docker-compose-ci.yml build base-node
          docker compose -f docker/docker-compose-ci.yml build web-node daemons-node || exit 1

      # Push order: versioned tags first, then :latest aliases together.
      - name: Tag and push images to ECR
        env:
          ECR_REGISTRY: ${{ steps.login_ecr.outputs.registry }}
          RELEASE_TAG: build-${{ steps.version.outputs.BUILD }}-${{ github.run_number }}
        run: |
          WEB_REPO="${ECR_REGISTRY}/matecat/matecat-web-node"
          DAEMONS_REPO="${ECR_REGISTRY}/matecat/matecat-daemons-node"

          docker tag matecat/matecat-web-node     $WEB_REPO:$RELEASE_TAG
          docker tag matecat/matecat-web-node     $WEB_REPO:latest
          docker tag matecat/matecat-daemons-node $DAEMONS_REPO:$RELEASE_TAG
          docker tag matecat/matecat-daemons-node $DAEMONS_REPO:latest

          # ── versioned tags first ──────────────────────────────────────────
          docker push $WEB_REPO:$RELEASE_TAG
          docker push $DAEMONS_REPO:$RELEASE_TAG

          # ── :latest aliases together ──────────────────────────────────────
          docker push $WEB_REPO:latest
          docker push $DAEMONS_REPO:latest

  # ───────────────────────────────────────────────────────────────────────────
  # JOB – test-guard (PR only)
  #
  # Downloads the "coverage-php" and "coverage-js" artifacts produced by the
  # test jobs and runs ostico/test-guard to evaluate test adequacy on changed
  # files.
  # ───────────────────────────────────────────────────────────────────────────
  test-guard:
    name: Test adequacy gate
    runs-on: ubuntu-24.04
    needs:
      - php-tests
      - js-tests
    if: >-
      github.event_name == 'pull_request' &&
      !contains(github.event.pull_request.labels.*.name, 'test-guard-exception')
    concurrency:
      group: matecat-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      checks: write
      # No `models: read` — it only ever gated GitHub Models, retired 2026-07-30.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download coverage artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Test Guard
        uses: ostico/test-guard@v2
        with:
          coverage-file: |
            php-coverage.xml
            js-coverage.xml
            node-coverage.xml
          coverage-threshold: '80'
          # dev-tools/** holds the custom PHPStan rules. phpunit.xml whitelists ./lib only, so
          # nothing under it can ever reach the clover report and Layer 1 reads it as "not in
          # coverage report" — a verdict no amount of testing could change.
          extra-exclude-patterns: >-
            .github/**, daemons/**, dev-tools/**, migrations/**, tests/unit/TestHelpers/**
          ai-enabled: 'true'
          # test-guard v2: GitHub Models was retired 2026-07-30 and Layer 3 now
          # calls any OpenAI-compatible endpoint, so it needs a provider key.
          # Without ai-api-key the AI phase is skipped and the gate silently
          # falls back to Layer 1 + Layer 2.
          ai-api-key: ${{ secrets.GEMINI_API_KEY }}
          # Trailing slash is required — without it the compat layer 404s.
          ai-base-url: 'https://generativelanguage.googleapis.com/v1beta/openai/'
          # Unprefixed: the `openai/` form was a GitHub Models publisher prefix.
          ai-model: 'gemini-3.1-flash-lite'
          # Gemini 3.x cannot disable thinking; minimal is the floor, and low
          # keeps the code-reasoning quality its benchmark scores are based on.
          ai-reasoning-effort: 'low'
          # Gemini 3.x recommends its default of 1.0 and warns that lowering
          # temperature causes looping and degraded reasoning.
          ai-temperature: '1.0'
          # The 8000 default was sized for GitHub Models' retired 8K input cap.
          # Gemini has a 1M context, and at 8000 a large test diff gets shed —
          # which makes the model warn about code it was never shown.
          ai-max-input-tokens: '32000'
          test-patterns: |
            {
              "php-unit":  {"src_pattern": "lib/**/*.php", "test_template": "tests/**/{name}Test.php"},
              "php-unitX": {"src_pattern": "lib/**/*.php", "test_template": "tests/**/{name}UnitTest.php"},
              "php-integ": {"src_pattern": "lib/**/*.php", "test_template": "tests/**/{name}IntegrationTest.php"},
              "php-sql":   {"src_pattern": "lib/**/*.php", "test_template": "tests/**/{name}RealSqlTest.php"}
            }

  slack-notification:
    name: Slack Notification
    runs-on: ubuntu-24.04
    needs:
      - php-tests
      - js-tests
      - deploy
      - test-guard
    if: >-
      always() &&
      (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork)
    permissions: {}
    steps:
      - name: Slack Notification
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_CHANNEL: travis-ci
          SLACK_TITLE: GitHub CI/CD Pipeline Complete for ${{ github.head_ref || github.ref_name }}
