name: ESLint

# Pull requests only. The comparison needs a base to measure against, and a
# push to develop has none that means anything.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  ratchet:
    name: ESLint must not regress
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout
        # Full history so the base branch can be checked out beside this one.
        # Submodules are deliberately not fetched: plugins/ is excluded from the
        # count, and cloning them over SSH needs deploy keys.
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Reads the yarn cache that the "JS tests" job of _ci-cd.yml saves on
      # every push to develop or master. The path and the key must stay equal
      # to the ones there. Nothing is saved here: a cache saved by a pull
      # request serves that pull request only.
      - name: Restore the yarn cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/ci-cache
          key: js-deps-${{ hashFiles('yarn.lock', 'nodejs/package-lock.json') }}
          restore-keys: js-deps-

      - name: Install dependencies
        env:
          YARN_CACHE_FOLDER: ${{ runner.temp }}/ci-cache/yarn
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Check out the base branch beside this one
        run: git worktree add ../base "origin/${{ github.base_ref }}"

      - name: Compare this branch against the base
        run: node .github/scripts/eslint-ratchet.js . ../base

  ratchet-tests:
    name: ESLint ratchet script tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Run tests
        run: node --test .github/scripts/eslint-ratchet.test.js
