<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <title>Configuration missing - Matecat</title>
</head>
<body class="status-page">
<main class="status-page__card">
    <a href="/" class="status-page__logo" aria-label="Matecat"></a>
    <h1 class="status-page__title">Configuration missing</h1>
    <div class="status-page__text">
        <p>It seems that you don't have a config.ini file. Please create a config.ini file based on config.ini.sample</p>
        <p><a id="badConf" href="/">Click this link after you corrected the issue to see if is all right.</a></p>
    </div>
</main>
<script>
  // self executing function here
  (function () {
    var href = document.getElementById("badConf");
    href.setAttribute("href", href + '?' + (new Date()).getTime());
  })();
</script>
</body>
</html>
