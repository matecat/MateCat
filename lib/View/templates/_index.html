<html dir="ltr" lang="it-IT">

        <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <meta property="og:title" content="Translate a file with Matecat" />

        <meta property="og:url" content="https://www.matecat.com" />

        <tal:block metal:use-macro="${php: Utils\Registry\AppConfig::$TRACKING_CODES_VIEW_PATH}/external_sources.html/header_common"/>
        <script tal:attributes="nonce x_nonce_unique_id" type="text/javascript">
            /*<![CDATA[*/

            // script block, so anything interpolated here lands in JavaScript syntax verbatim. See
            // BootstrapConfig. The five follow-up blocks that used to augment this object are gone with
            // it: every value they added is a view variable, so it is already in the document.
            var config = ${structure config_json};
            /*]]>*/
        </script>







    </head>

    <body class="cattool">
        <div class="page-content"></div>
        <tal:block metal:use-macro="templates/common.html/footer_includes" />

        <div class="notifications-wrapper"></div>
