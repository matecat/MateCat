<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <title>Bad configuration</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/public/img/meta/favicon-32x32.svg"/>
    <link rel="icon" type="image/png" sizes="16x16" href="/public/img/meta/favicon-16x16.svg"/>
</head>
<body class="status-page">
<main class="status-page__card">
    <a href="/" class="status-page__logo" aria-label="Matecat"></a>
    <h1 class="status-page__title">Bad configuration</h1>
    <div class="status-page__text">
        <p>Dear system administrator, the Matecat configuration file ( config.ini ) is not up-to-date.</p>
        <p><a id="badConf" href="/">Click this link after you corrected the issue to see if is all right.</a></p>
        <p>A message has been sent to the system administrator. Please retry in 5 minutes.</p>
    </div>
</main>
<script>
  // self executing function here
  (function () {
    var href = document.getElementById("badConf");
    href.setAttribute("href", href + '?' + (new Date()).getTime());
  })();
</script>
</body>
</html>
