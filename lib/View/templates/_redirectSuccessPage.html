
<html lang="en">
	<head>
		<title>Redirecting to your order</title>
		<div metal:use-macro="${php: Utils\Registry\AppConfig::$TRACKING_CODES_VIEW_PATH}/CSP-HeaderMeta.html/CSP_NONCE"/>
		<script tal:attributes="nonce x_nonce_unique_id">
          // One serialised document rather than a value per line: PHPTAL does not escape inside a
          // script block, so anything interpolated here lands in JavaScript syntax verbatim.
          // See BootstrapConfig.
          var config = $;
          {
            structure;
            config_json;
          }
          ;
            document.addEventListener('DOMContentLoaded', function() {
              // `data` arrives already serialised, so it goes to the field as it stands. It used to be
              // inlined as an object literal and re-serialised here — a decode/encode round trip that
              // could only return the same document.

              document.getElementById('sessionData').value = config.data;
              document.getElementById('tokenAuth').value = config.tokenAuth;
              document.getElementById('data_key').value = config.data_key;

              document.getElementById('redirectForm').submit();
            });
	
		</script>
	</head>
	<body>
		 <form style="visibility: hidden" id="redirectForm" action="${redirect_url}" method="POST">
             <input type="hidden" id="tokenAuth" name="tokenAuth" value="" />
             <input type="hidden" id="sessionData" name="data" value="" />
             <input type="hidden" id="data_key" name="data_key" value="" />
		</form>
	</body>
</html>
